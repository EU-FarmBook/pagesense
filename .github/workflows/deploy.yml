name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    # Required: the default workflow token is read-only, and a called workflow
    # cannot be granted more than its caller holds.
    permissions:
      contents: read
      packages: write
    uses: EU-FarmBook/ci-workflows/.github/workflows/build-and-deploy.yml@v1
    with:
      service: pagesense
    # Named, not `secrets: inherit`: inherit forwards every secret the caller
    # can see, which is an organisation-level fact this repository cannot audit.
    secrets:
      PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
